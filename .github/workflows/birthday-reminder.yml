name: Birthday reminders

on:
  schedule:
    - cron: '30 5 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out birthday list
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send tomorrow's birthday reminder
        run: node scripts/send-birthday-reminder.js
        env:
          RECIPIENT_PHONE: ${{ secrets.BIRTHDAY_RECIPIENT_PHONE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_CONTENT_SID: ${{ secrets.TWILIO_WHATSAPP_CONTENT_SID }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
          REMINDER_EMAIL_FROM: ${{ secrets.REMINDER_EMAIL_FROM }}
