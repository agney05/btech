<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Birthday!</title>
</head>

<body>
    <div class="header">
        <h1>Birthday!!</h1>
        <button class="goToTableButton" onclick="goToBirthdaysThisMonthTable()">Go to Birthdays This Month</button>
    </div>

    <!-- Search bar -->
    <input type="text" id="searchInput" oninput="searchPeople()" placeholder="Search by name">

    <!-- Table displaying all people -->
    <h2>Birthday Table!</h2>
    <table id="allPeopleTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>DOB</th>
            </tr>
        </thead>
        <tbody id="allPeopleList">
            <!-- Birthday rows are loaded from birthdays.json. -->
        </tbody>
    </table>

    <!-- Table displaying people for the current month -->
    <h2>Birthdays This Month</h2>
    <table id="birthdaysThisMonthTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>DOB</th>
            </tr>
        </thead>
        <tbody id="birthdaysThisMonthList"></tbody>
    </table>
</body>

</html>
